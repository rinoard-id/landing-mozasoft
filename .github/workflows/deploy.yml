name: 🚀 Deploy Landing Page ke Shared Hosting

on:
  push:
    branches:
      - main

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Upload via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ./
          exclude: |
            .git/
            .git*
            .github/
            node_modules/
            asesmen.mozasoft.com/
            cgi-bin/
            .well-known/
            vendor/
            .env
            lsp/config.php
